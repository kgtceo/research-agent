[project]
name = "research-agent"
version = "0.1.0"
description = "A tool-using agent that researches a company (web search + fetch) into an interview briefing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kareem Ghazal" }]
keywords = ["llm", "ai", "agent", "tool-use", "anthropic", "research", "evals"]
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "ddgs>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
research-agent = "research_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
